name: Deploy ASP.NET Core App to SmarterASP.NET

on:
  push:
    branches:
      - main  # Hoặc master tùy thuộc vào nhánh chính của bạn

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout source code từ GitHub
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Cài đặt .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x' # Thay đổi thành 7.0.x hoặc 6.0.x nếu dự án dùng version khác

    # 3. Restore dependencies và Build dự án
    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    # 4. Publish dự án ra thư mục ./publish
    - name: Publish App
      run: dotnet publish --configuration Release --output ./publish --no-build

    # 5. Chèn API Key vào appsettings.json bằng PowerShell
    - name: Inject API Key into appsettings.json
      shell: pwsh
      run: |
        $path = "./publish/appsettings.json"
        $json = Get-Content $path -Raw | ConvertFrom-Json
        $json.OpenAI.ApiKey = "${{ secrets.GEMINI_API_KEY }}"
        $json | ConvertTo-Json -Depth 10 | Set-Content $path
        
        Write-Host "--- CHECK APPSETTINGS CONTENTS ON RUNNER ---"
        Get-Content $path

    # 6. Tạo file app_offline.htm để báo IIS giải phóng file
    - name: Create app_offline.htm
      run: |
        echo "<html><head><meta charset='utf-8'></head><body><h2 style='text-align:center;margin-top:100px;'>Hệ thống đang bảo trì và cập nhật phiên bản mới. Vui lòng quay lại sau ít phút...</h2></body></html>" > ./publish/app_offline.htm

    # 7. Đẩy CHỈ FILE app_offline.htm lên server trước để IIS nhả lock file
    - name: Take site offline on IIS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
        passive: true
        dangerous-clean-slate: false
        exclude: |
          **/*
          !app_offline.htm

    # 8. Tạm dừng 3 giây đợi IIS ngắt hoàn toàn tiến trình Web
    - name: Wait for IIS to unlock files
      run: sleep 3

    # 9. Upload TOÀN BỘ source code lên server (/site1/)
    - name: FTP Deploy full application
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
        passive: true
        timeout: 600000
        state-name: .ftp-deploy-sync-state.json
        force-upload: true
        exclude: |
          **/.git*
          **/.git*/**

    # 10. 🟢 XÓA FILE app_offline.htm CẢ Ở RUNNER VÀ TRÊN SERVER ĐỂ IIS KHỞI ĐỘNG LẠI
    - name: Remove app_offline.htm locally and trigger online
      run: |
        rm -f ./publish/app_offline.htm

    # 11. 🟢 Sync lại một lần nữa để FTP xóa file app_offline.htm trên Server
    - name: Remove app_offline.htm on Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
        passive: true
