name: Deploy ASP.NET Core App to SmarterASP.NET

on:
  push:
    branches:
      - main  # Hoặc master tùy nhánh chính của Hào

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout source code từ GitHub
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Cài đặt .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x' # Sửa lại version phù hợp nếu dùng .NET 7/8/9

    # 3. Restore dependencies và Build dự án
    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    # 4. Publish dự án ra thư mục ./publish
    - name: Publish App
      run: dotnet publish --configuration Release --output ./publish

    # 5. 🟢 [CHÍNH XÁC]: THẾ API KEY TRỰC TIẾP VÀO THƯ MỤC PUBLISH
    # Sau khi dotnet publish xong, ta ghi đè Key thẳng vào file đóng gói cuối cùng
    - name: Appsettings Variable Substitution
      uses: microsoft/variable-substitution@v1
      with:
        files: './publish/appsettings.json'
      env:
        OpenAI.ApiKey: ${{ secrets.GEMINI_API_KEY }}

    # 6. Verify kiểm tra Key đã chắc chắn có trong file trước khi đẩy FTP
    - name: Verify appsettings.json
      run: cat ./publish/appsettings.json

    # 7. Tạo file app_offline.htm để IIS nhả lock file
    - name: Create app_offline.htm
      run: |
        echo "<html><head><meta charset='utf-8'></head><body><h2 style='text-align:center;margin-top:100px;'>Hệ thống đang bảo trì và cập nhật phiên bản mới. Vui lòng quay lại sau ít phút...</h2></body></html>" > ./publish/app_offline.htm

    # 8. Đẩy file app_offline.htm lên trước
    - name: Take site offline on IIS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
        passive: true
        dangerous-clean-slate: false
        exclude: |
          **/*
          !app_offline.htm

    # 9. Tạm dừng 3 giây đợi IIS ngắt hoàn toàn tiến trình Web
    - name: Wait for IIS to unlock files
      run: sleep 3

    # 10. Upload TOÀN BỘ source code lên server
    - name: FTP Deploy full application
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
        passive: true
        timeout: 600000
        force-upload: true      # 🟢 Bắt buộc ghi đè toàn bộ file mới
        exclude: |
          **/.git*
          **/.git*/**

    # 11. Xóa app_offline.htm ở local
    - name: Remove app_offline.htm locally
      run: |
        rm -f ./publish/app_offline.htm

    # 12. Sync lại để gỡ app_offline.htm trên Server -> Site online lại
    - name: Remove app_offline.htm on Server & Start Site
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /site1/
        passive: true
