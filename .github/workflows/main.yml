name: Build and Auto Deploy Green Fresh

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy source code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Cài đặt .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    # 3. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 4. Publish project ra thư mục ./publish TRƯỚC
    - name: dotnet publish
      run: dotnet publish --configuration Release --output ./publish

    # 5. 🟢 CHÈN KEY TRỰC TIẾP VÀO FILE APPSETTINGS TRONG THƯ MỤC ./PUBLISH
    - name: Inject API Key into appsettings.json
      run: |
        sed -i 's/"ApiKey": ""/"ApiKey": "${{ secrets.GEMINI_API_KEY }}"/g' ./publish/appsettings.json
        echo "Check contents of appsettings.json after injection:"
        cat ./publish/appsettings.json

    # 6. Push thư mục ./publish đã có ApiKey lên FTP SmarterASP.NET
    - name: FTP Deploy to site1
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
        force-upload: true
        exclude: |              # Xóa bỏ danh sách lọc mặc định để không bỏ sót appsettings.json
          **/.git*
          **/.git*/**
