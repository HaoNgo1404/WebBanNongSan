name: Build and Auto Deploy Green Fresh

on:
  push:
    branches: [ "main" ] # Hoặc đổi thành "master" nếu Hào dùng nhánh master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy source code từ GitHub về
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Cài đặt .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    # 3. Khôi phục các thư viện NuGet
    - name: Restore dependencies
      run: dotnet restore

    # 4. 🟢 CHẠY PUBLISH TRƯỚC ĐỂ SINH RA THƯ MỤC LƯU TRỮ PRODUCTION
    - name: dotnet publish
      run: dotnet publish --configuration Release --output ./publish

    # 5. 🟢 CHÈN API KEY THẲNG VÀO FILE TRONG THƯ MỤC PUBLISH (Sửa triệt để lỗi không nhận key)
    - name: Appsettings Variable Substitution
      uses: microsoft/variable-substitution@v1
      with:
        files: 'publish/**/appsettings*.json' # Quét và chèn vào toàn bộ file appsettings nằm trong folder publish
      env:
        OpenAI.ApiKey: ${{ secrets.GEMINI_API_KEY }}

    # 6. Deploy toàn bộ thư mục ./publish (đã được chèn Key thành công) lên SmarterASP via FTP
    - name: FTP Deploy to site1
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
