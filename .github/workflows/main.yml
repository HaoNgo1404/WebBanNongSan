name: Build and Auto Deploy Green Fresh

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy source code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Cài đặt .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    # 3. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 4. Publish project ra thư mục ./publish TRƯỚC
    - name: dotnet publish
      run: dotnet publish --configuration Release --output ./publish

    # 5. Đọc JSON và gán ApiKey bằng PowerShell (không sợ lệch khoảng trắng/định dạng)
    - name: Inject API Key into appsettings.json
      shell: pwsh
      run: |
        $path = "./publish/appsettings.json"
        $json = Get-Content $path -Raw | ConvertFrom-Json
        $json.OpenAI.ApiKey = "${{ secrets.GEMINI_API_KEY }}"
        $json | ConvertTo-Json -Depth 10 | Set-Content $path
        
        Write-Host "--- LOG KIỂM TRA NỘI DUNG FILE TRÊN RUNNER ---"
        Get-Content $path

    # 6. Deploy lên FTP SmarterASP.NET
    - name: FTP Deploy to site1
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
        force-upload: true
